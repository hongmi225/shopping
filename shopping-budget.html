<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장보기 예산 계산기</title>
<style>
  :root{
    --bg: #F1EEEA;
    --card: #FFFFFF;
    --accent: #9C948A;
    --accent-dark: #4C4640;
    --text: #3A352F;
    --muted: #8A8177;
    --line: #E3DFDA;
    --danger: #C65B4E;
    --safe: #4F8F72;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color:var(--text);
    padding:20px 14px 60px;
  }
  .wrap{max-width:520px; margin:0 auto;}
  h1{
    font-size:20px;
    font-weight:700;
    margin:4px 0 18px;
    letter-spacing:-0.3px;
  }
  .budget-card{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(76,70,64,0.10);
  }
  .budget-card label{
    font-size:13px;
    color:var(--muted);
    display:block;
    margin-bottom:6px;
  }
  .budget-input{
    width:100%;
    font-size:22px;
    font-weight:700;
    border:none;
    outline:none;
    background:transparent;
    color:var(--accent-dark);
    padding:0;
  }
  .budget-input::placeholder{color:#CFC9C1;}

  .summary{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .summary-box{
    flex:1;
    background:var(--card);
    border-radius:14px;
    padding:12px 14px;
    box-shadow:0 2px 10px rgba(76,70,64,0.08);
  }
  .summary-box .label{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .summary-box .value{font-size:18px; font-weight:700;}
  .summary-box.remain .value.over{color:var(--danger);}
  .summary-box.remain .value.ok{color:var(--safe);}

  .item-list{margin-bottom:12px;}
  .item{
    background:var(--card);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 10px rgba(76,70,64,0.08);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .item-top{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .item-top input[type="checkbox"]{
    width:18px; height:18px;
    accent-color:var(--accent-dark);
    flex-shrink:0;
  }
  .item-name{
    flex:1;
    border:none;
    border-bottom:1px solid var(--line);
    outline:none;
    font-size:16px;
    padding:4px 2px;
    background:transparent;
    color:var(--text);
  }
  .item-name::placeholder{color:#C2BBB1;}
  .del-btn{
    border:none;
    background:none;
    color:var(--muted);
    font-size:18px;
    line-height:1;
    padding:2px 4px;
    cursor:pointer;
  }
  .item-nums{
    display:flex;
    align-items:center;
    gap:6px;
    padding-left:26px;
  }
  .item-nums input[type="number"]{
    width:0;
    flex:1;
    border:none;
    border-bottom:1px solid var(--line);
    outline:none;
    font-size:16px;
    padding:4px 2px;
    background:transparent;
    color:var(--text);
    -moz-appearance:textfield;
  }
  .item-nums input::-webkit-outer-spin-button,
  .item-nums input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .item-nums .x{color:var(--muted); font-size:13px;}
  .item-subtotal{
    padding-left:26px;
    font-size:13px;
    color:var(--muted);
  }
  .item-subtotal b{color:var(--text);}
  .item.excluded{opacity:0.45;}

  .add-btn{
    width:100%;
    padding:13px;
    border:1.5px dashed var(--accent);
    background:transparent;
    color:var(--accent-dark);
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:8px;
  }
  .add-btn:active{background:#EAE7E2;}

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 장보기 예산 계산기</h1>

  <div class="budget-card">
    <label for="budget">예산</label>
    <input type="number" id="budget" class="budget-input" placeholder="0" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>

  <div class="summary">
    <div class="summary-box">
      <div class="label">총액</div>
      <div class="value" id="totalVal">0원</div>
    </div>
    <div class="summary-box remain">
      <div class="label">잔액</div>
      <div class="value ok" id="remainVal">0원</div>
    </div>
  </div>

  <div class="item-list" id="itemList"></div>
  <div class="empty" id="emptyMsg">항목을 추가해보세요</div>

  <button class="add-btn" id="addBtn">+ 항목 추가</button>
</div>

<script>
// 아이폰 사파리에서 입력할 때마다 DOM을 통째로 새로 그리면
// 입력창이 새로 생성되면서 키보드 포커스가 끊긴다.
// 그래서 "항목 추가/삭제"할 때만 리스트 전체를 다시 그리고,
// 글자 입력(oninput)할 때는 기존 DOM은 그대로 두고 소계/총액 숫자만 갱신한다.
// 추가로 자동완성/맞춤법 제안 바가 레이아웃을 흔들며 포커스를 끊는 것도
// 예방하기 위해 모든 입력창에 autocomplete/autocorrect/spellcheck를 꺼둔다.

let items = [];
let idCounter = 0;

function addItem(){
  items.push({id: idCounter++, name:'', price:'', qty:'', checked:true});
  renderList();
}

function removeItem(id){
  items = items.filter(it => it.id !== id);
  renderList();
}

function formatWon(n){
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

// 항목 추가/삭제 시에만 호출: 리스트 DOM을 전체 재생성
function renderList(){
  const list = document.getElementById('itemList');
  const emptyMsg = document.getElementById('emptyMsg');
  list.innerHTML = '';

  emptyMsg.style.display = items.length === 0 ? 'block' : 'none';

  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.id = it.id;
    div.innerHTML = `
      <div class="item-top">
        <input type="checkbox" class="chk" ${it.checked ? 'checked' : ''}>
        <input type="text" class="item-name" placeholder="항목명 (예: 우유)" value="${it.name}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="del-btn">✕</button>
      </div>
      <div class="item-nums">
        <input type="number" class="price" placeholder="단가" inputmode="numeric" value="${it.price}" autocomplete="off">
        <span class="x">×</span>
        <input type="number" class="qty" placeholder="갯수" inputmode="numeric" value="${it.qty}" autocomplete="off">
      </div>
      <div class="item-subtotal">소계 <b class="subtotal-val">0원</b></div>
    `;

    const chk = div.querySelector('.chk');
    const nameInput = div.querySelector('.item-name');
    const priceInput = div.querySelector('.price');
    const qtyInput = div.querySelector('.qty');
    const delBtn = div.querySelector('.del-btn');

    chk.addEventListener('change', () => {
      it.checked = chk.checked;
      div.classList.toggle('excluded', !it.checked);
      updateTotals();
    });
    nameInput.addEventListener('input', () => { it.name = nameInput.value; });
    priceInput.addEventListener('input', () => { it.price = priceInput.value; updateItemSubtotal(div, it); updateTotals(); });
    qtyInput.addEventListener('input', () => { it.qty = qtyInput.value; updateItemSubtotal(div, it); updateTotals(); });
    delBtn.addEventListener('click', () => removeItem(it.id));

    div.classList.toggle('excluded', !it.checked);
    list.appendChild(div);
    updateItemSubtotal(div, it);
  });

  updateTotals();
}

// 글자/숫자 입력할 때 호출: 해당 카드의 소계 텍스트만 갱신 (DOM 재생성 없음)
function updateItemSubtotal(div, it){
  const price = parseFloat(it.price) || 0;
  const qty = parseFloat(it.qty) || 0;
  const subtotal = price * qty;
  div.querySelector('.subtotal-val').textContent = formatWon(subtotal);
}

// 총액/잔액만 갱신 (리스트 DOM은 건드리지 않음)
function updateTotals(){
  let total = 0;
  items.forEach(it => {
    if(it.checked){
      const price = parseFloat(it.price) || 0;
      const qty = parseFloat(it.qty) || 0;
      total += price * qty;
    }
  });

  document.getElementById('totalVal').textContent = formatWon(total);

  const budget = parseFloat(document.getElementById('budget').value) || 0;
  const remain = budget - total;
  const remainEl = document.getElementById('remainVal');
  remainEl.textContent = (remain < 0 ? '-' : '') + formatWon(Math.abs(remain));
  remainEl.className = 'value ' + (remain < 0 ? 'over' : 'ok');
}

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('budget').addEventListener('input', updateTotals);

// 초기 항목 하나 추가
addItem();
</script>
</body>
</html>
